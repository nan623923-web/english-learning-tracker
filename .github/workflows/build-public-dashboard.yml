name: Build public dashboard

on:
  push:
    branches: [main]
    paths:
      - 'public-site/**'
      - 'client/src/pages/checkins/**'
      - 'client/src/assets/profile-avatar.jpg'
      - 'shared/api.interface.ts'
      - 'vite.public.config.mts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-public-dashboard.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:public
      - name: Commit public build
        run: |
          if git diff --quiet -- docs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Build public dashboard"
          git push
